<!-- Trimmed-down structure of a chromehearts.com product page (Salesforce Commerce Cloud), for tests. -->
<html><body>
<script type="application/ld+json">
{"@context":"http://schema.org/","@type":"Product","name":"CH LOGO SOCKS","sku":"176354XXXXXX349",
 "offers":{"@type":"Offer","priceCurrency":"USD","price":"255.00","availability":"http://schema.org/InStock"}}
</script>
<div class="container product-detail" data-pid="176354XXXXXX349">
  <div class="row color-container js-variations-container" data-attr="color">
    <button class="swatch-attribute color-attribute" aria-label="Select Color Black">
      <span data-attr-value="BLK" class="color-value swatch-box swatch-value selectable"></span></button>
    <button class="swatch-attribute color-attribute" aria-label="Select Color WHITE">
      <span data-attr-value="WHT" class="color-value swatch-box swatch-value unselectable"></span></button>
  </div>
  <div class="row size-container js-variations-container" data-attr="size">
    <button class="swatch-attribute size-attribute" aria-label="Select Size S">
      <span data-attr-value="SML" class="size-value swatch-box swatch-value selectable">S</span></button>
  </div>
  <button class="add-to-cart">Add to Bag</button>
  <div class="product-not-available-msg-pdp d-none">This product is not available in your country</div>
</div>
</body></html>
