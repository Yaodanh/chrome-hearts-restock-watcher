name: Chrome Hearts watcher

on:
  schedule:
    # Every 20 minutes (times are UTC). Off the hour on purpose: GitHub's
    # scheduler is busiest at :00, and busy schedules start late.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual check

# Never run two checks at once; a late run just waits for the previous one.
concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # needed to save the state cache

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Each run starts on a fresh machine, so the "what did we see last time"
      # database is carried between runs in the Actions cache.
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: state.db
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check the store
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          cp config.example.yaml config.yaml
          python -m restock --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state.db
          key: state-${{ github.run_id }}
